<!doctype html>
<html lang="ru">

<head>
  <title> Mint login </title>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>{% block title %}{% endblock %}</title>
  <link rel="canonical" href="https://getbootstrap.com/docs/5.2/examples/sign-in/">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">
</head>

<body>


  <div class="bform py-5">
    <!-- Row -->
    <div class="row">
      <div class="container d-flex justify-content-center">
        <div class="col-lg-6 pr-4 pl-0 contact-form">
          {% if forms.error %}
          <p>{{ form.errors.error }}</p>
          {% endif %}
          <form class="mt-3" action="{% url 'login' %}" method="post">
            <div class="row">
              {% for f in form %}
                <p class="row"> <label class="form-label" for="{{ f.id_for_label }}"> {{f.label}} </label>{{ f }}</p>
              {% endfor %}
              {% csrf_token %}
              <div class="p-0 mt-3">
                <button type="submit" class="btn btn-md btn-success border-0 py-12">Submit</button>
                <hr>
                <a href="{% url 'password_reset' %}"> Забыли пароль? </a>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
